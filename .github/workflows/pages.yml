name: Deploy public educational demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Carraway-and-Gatsby/cardiac-simulator' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - name: Check public source and behavior
        run: |
          npm run verify:source
          npm test
      - name: Install pinned Blender 4.5 LTS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libice6 libgomp1
          archive="$RUNNER_TEMP/blender-4.5.12-linux-x64.tar.xz"
          curl --fail --location --retry 3 --max-time 600 https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz --output "$archive"
          # Official https://download.blender.org/release/Blender4.5/blender-4.5.12.sha256
          printf '95e3a2dfedba3bd32ca54fc355eac6b15a11986954ccb02815a07535d0120a25  %s\n' "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$archive" -C "$RUNNER_TEMP/blender" --strip-components=1
          printf 'BLENDER_BIN=%s/blender/blender\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build and inspect the pinned HRA derivative
        run: |
          npm run anatomy:acquire
          npm run blender:build
          npm run blender:check
          npm run verify:assets
      - name: Build the explicitly scoped unreviewed demo
        run: npm run build:pages
      - name: Upload only the inspected public demo artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .local/pages
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
